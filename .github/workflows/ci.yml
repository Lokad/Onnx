name: ci

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300-preview.0.26177.108
      - name: Restore
        run: dotnet restore --tl:off -v minimal Lokad.Onnx.slnx
      - name: Build Release
        run: dotnet build --tl:off --nologo -v minimal -c Release Lokad.Onnx.slnx --no-restore
      - name: Test Release
        run: dotnet test --tl:off --nologo -v minimal -c Release --no-build Lokad.Onnx.slnx
  fallback-tests:
    runs-on: windows-latest
    env:
      DOTNET_EnableHWIntrinsic: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300-preview.0.26177.108
      - name: Restore
        run: dotnet restore --tl:off -v minimal Lokad.Onnx.slnx
      - name: Build Release
        run: dotnet build --tl:off --nologo -v minimal -c Release Lokad.Onnx.slnx --no-restore
      - name: Test Release without hardware intrinsics
        run: dotnet test --tl:off --nologo -v minimal -c Release --no-build Lokad.Onnx.slnx
  opfuzz:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300-preview.0.26177.108
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Install lane packages
        run: python -m pip install -r tests/opfuzz/python/requirements.txt
      - name: Differential lane
        run: pwsh -NoProfile -File eng/test-opfuzz.ps1
  smoke-pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300-preview.0.26177.108
      - name: Package smoke
        run: pwsh -NoProfile -File eng/smoke-pack.ps1

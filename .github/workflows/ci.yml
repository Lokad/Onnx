name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: change scope
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
      package: ${{ steps.scope.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - name: Classify changed files
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -m unittest discover -s eng -p test_ci_scope.py
          python3 -m unittest discover -s eng -p test_bench.py
          python3 -m unittest discover -s eng -p test_common_campaign.py
          python3 -m unittest discover -s eng -p test_entrypoint_state.py
          python3 -m unittest discover -s eng -p test_parse_baseline.py
          python3 -m unittest discover -s eng -p test_restore_experiments.py
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$BASE" "$HEAD"
          fi
          python3 eng/ci_scope.py --base "$BASE" --head "$HEAD" --output "$GITHUB_OUTPUT"
  offline-tests:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify qualified dependency content
        shell: pwsh
        run: python -m unittest discover -s eng -p test_tokenizer_restore.py
      - name: Test Release
        shell: pwsh
        run: |
          ./eng/restore-tokenizers.ps1
          try { ./eng/test.ps1 -Configuration Release -BuildTools:($env:RUNNER_OS -eq 'Linux') 2>&1 | Tee-Object -FilePath test-vector.log } catch { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Publish test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: test-vector.log
  fallback-tests:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    name: tests scalar (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_EnableHWIntrinsic: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test Release without hardware intrinsics
        shell: pwsh
        run: |
          ./eng/restore-tokenizers.ps1
          try { ./eng/test.ps1 -Configuration Release 2>&1 | Tee-Object -FilePath test-scalar.log } catch { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Publish test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-scalar-${{ matrix.os }}
          path: test-scalar.log
  opfuzz:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    name: opfuzz (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Install lane packages
        shell: pwsh
        run: python -m pip install -r tests/opfuzz/python/requirements.txt
      - name: Verify embedding benchmark protocol guards
        shell: pwsh
        run: python -m unittest discover -s eng -p test_embeddinggemma2_campaign.py
      - name: Differential lane
        shell: pwsh
        run: pwsh -NoProfile -File eng/test-opfuzz.ps1
  smoke-pack:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    name: pack (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Package smoke
        shell: pwsh
        run: pwsh -NoProfile -File eng/smoke-pack.ps1
      - name: Publish package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: artifacts/nuget/*

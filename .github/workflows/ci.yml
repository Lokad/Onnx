name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test Release
        shell: pwsh
        run: |
          $runOk = $true; $runErr = ''
          try { ./eng/test.ps1 -Configuration Release 2>&1 | Tee-Object -FilePath test-vector.log } catch { $runOk = $false; $runErr = $_.Exception.Message }
          if ((-not $runOk) -or ($LASTEXITCODE -ne 0)) {
            if ($runErr) { Write-Host ('::warning::diag ERR ' + ($runErr -replace '%','%25')) }
            if (Test-Path test-vector.log) { $dl = Get-Content test-vector.log; for ($i=0; $i -lt $dl.Count; $i++) { if ($dl[$i] -match '^Failed \S') { for ($j=$i; $j -lt [Math]::Min($i+25, $dl.Count); $j++) { Write-Host ('::warning::diag ' + ($dl[$j] -replace '%','%25')) } } }; $dl | Select-String -Pattern 'Passed!|Failed!|Testhost|Segmentation|FailFast|core dumped|Aborted|Killed' | Select-Object -Last 10 | ForEach-Object { Write-Host ('::warning::diag ' + ($_.Line -replace '%','%25')) } }
            exit 1
          }
      - name: Publish test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: test-vector.log
  fallback-tests:
    name: tests scalar (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_EnableHWIntrinsic: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test Release without hardware intrinsics
        shell: pwsh
        run: |
          $runOk = $true; $runErr = ''
          try { ./eng/test.ps1 -Configuration Release 2>&1 | Tee-Object -FilePath test-scalar.log } catch { $runOk = $false; $runErr = $_.Exception.Message }
          if ((-not $runOk) -or ($LASTEXITCODE -ne 0)) {
            if ($runErr) { Write-Host ('::warning::diag ERR ' + ($runErr -replace '%','%25')) }
            if (Test-Path test-scalar.log) { $dl = Get-Content test-scalar.log; for ($i=0; $i -lt $dl.Count; $i++) { if ($dl[$i] -match '^Failed \S') { for ($j=$i; $j -lt [Math]::Min($i+25, $dl.Count); $j++) { Write-Host ('::warning::diag ' + ($dl[$j] -replace '%','%25')) } } }; $dl | Select-String -Pattern 'Passed!|Failed!|Testhost|Segmentation|FailFast|core dumped|Aborted|Killed' | Select-Object -Last 10 | ForEach-Object { Write-Host ('::warning::diag ' + ($_.Line -replace '%','%25')) } }
            exit 1
          }
      - name: Publish test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-scalar-${{ matrix.os }}
          path: test-scalar.log
  opfuzz:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Install lane packages
        shell: pwsh
        run: python -m pip install -r tests/opfuzz/python/requirements.txt
      - name: Differential lane
        shell: pwsh
        run: pwsh -NoProfile -File eng/test-opfuzz.ps1
  smoke-pack:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Package smoke
        shell: pwsh
        run: pwsh -NoProfile -File eng/smoke-pack.ps1
      - name: Publish package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts/nuget/*
